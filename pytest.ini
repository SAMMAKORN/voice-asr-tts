[pytest]
# ค่าเริ่มต้น: รันเฉพาะเทสต์ที่ไม่ต่อเน็ตจริงและไม่เปิดเบราว์เซอร์
# (ต้องการรันของจริง: pytest -m network  /  pytest -m browser)
testpaths = tests
addopts = -m "not network and not browser"

markers =
    unit: เทสต์เร็ว ไม่แตะเครือข่าย ไม่แตะอุปกรณ์เสียง
    integration: ต่อหลายส่วนเข้าด้วยกัน (ยังไม่ออกอินเทอร์เน็ต)
    network: ต้องต่ออินเทอร์เน็ต/เรียก API จริง
    browser: ต้องเปิดเบราว์เซอร์จริง (Playwright)
    phase2: เทสต์ที่พิสูจน์บั๊กซึ่งจะแก้ในเฟส 2 (P2-5 / P2-6) — ยัง RED โดยตั้งใจ
